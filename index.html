<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Warehouse Move Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #121212;
    --panel: #1c1c1c;
    --panel2: #262626;
    --accent: #d4a017;
    --text: #f0f0f0;
    --muted: #9a9a9a;
    --danger: #c0392b;
    --ok: #3a8a4a;
    --border: #333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
    padding-bottom: 90px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 17px; margin: 0; }
  #printerStatus { font-size: 12px; padding: 4px 8px; border-radius: 12px; background: var(--panel2); color: var(--muted); }
  #printerStatus.connected { color: var(--ok); }
  main { padding: 14px; max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 10px; font-size: 15px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .btn {
    display: inline-block; width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
    border-radius: 8px; border: none; text-align: center; cursor: pointer; margin-top: 10px;
  }
  .btn-primary { background: var(--accent); color: #1a1a1a; }
  .btn-secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-ok { background: var(--ok); color: white; }
  .toggle-group { display: flex; gap: 8px; margin-top: 4px; }
  .toggle-group button {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--muted); font-weight: 600;
  }
  .toggle-group button.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
  #photoPreview {
    width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px;
    background: #000; display: none; margin-top: 8px;
  }
  .item-list { list-style: none; padding: 0; margin: 0; }
  .item-row {
    display: flex; gap: 10px; padding: 10px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 8px; background: var(--panel);
    align-items: center;
  }
  .item-row img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; background: #000; cursor: pointer; }
  .item-meta { flex: 1; min-width: 0; }
  .item-meta .title { font-weight: 600; font-size: 14px; }
  .item-meta .sub { font-size: 12px; color: var(--muted); }
  .status-pill {
    font-size: 10px; padding: 2px 8px; border-radius: 10px; text-transform: uppercase;
    background: var(--panel2); color: var(--muted);
  }
  .status-pill.labeled { color: var(--accent); }
  .status-pill.shelved { color: var(--ok); }
  .item-actions { display: flex; flex-direction: column; gap: 6px; }
  .item-actions button { font-size: 11px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); }
  .item-actions button.shelved-btn { border-color: var(--ok); color: var(--ok); background: transparent; }
  .item-actions button.danger-btn { border-color: var(--danger); color: var(--danger); background: transparent; }
  #photoModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 50;
    display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
  }
  #photoModal.active { display: flex; }
  #photoModal img { max-width: 100%; max-height: 68vh; border-radius: 8px; }
  #photoModal .modal-actions { display: flex; gap: 10px; margin-top: 16px; width: 100%; max-width: 380px; }
  #photoModal .modal-actions button { flex: 1; margin-top: 0; }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--border); display: flex; z-index: 10;
  }
  nav.tabs button {
    flex: 1; padding: 14px; background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600;
  }
  nav.tabs button.active { color: var(--accent); }
  .view { display: none; }
  .view.active { display: block; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
  .log { font-size: 11px; color: var(--muted); background: #000; border-radius: 6px; padding: 8px; max-height: 120px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
</style>
</head>
<body>

<header>
  <h1>Move Tracker</h1>
  <span id="printerStatus">Printer: not connected</span>
</header>

<main>

  <!-- CAPTURE VIEW -->
  <section id="view-capture" class="view active">
    <div class="card">
      <label>Photo</label>
      <input type="file" id="photoInput" accept="image/*" capture="environment">
      <img id="photoPreview">

      <label>Captured by</label>
      <select id="employeeSelect">
        <option value="">Select...</option>
      </select>

      <label>This item is for</label>
      <div class="toggle-group">
        <button type="button" id="typeJobBtn" class="active">Job</button>
        <button type="button" id="typeStockBtn">Stock</button>
      </div>

      <div id="jobNumberWrap">
        <label>Job number</label>
        <input type="text" id="jobNumber" placeholder="e.g. J-4821">
      </div>

      <label>Description</label>
      <input type="text" id="description" placeholder="e.g. 40mm hex bolts, box of 200">

      <div class="row">
        <div>
          <label>Qty</label>
          <input type="number" id="qty" value="1" min="0">
        </div>
        <div>
          <label>Destination bin</label>
          <input type="text" id="destBin" placeholder="e.g. A-03-02">
        </div>
      </div>

      <button class="btn btn-primary" id="saveItemBtn">Save item</button>
    </div>
  </section>

  <!-- QUEUE VIEW -->
  <section id="view-queue" class="view">
    <div class="card">
      <div class="row">
        <button class="btn btn-secondary" id="connectPrinterBtn">Connect printer</button>
        <button class="btn btn-secondary" id="exportBtn">Export data</button>
      </div>
      <div id="printerLog" class="log" style="margin-top:10px; display:none;"></div>
    </div>
    <ul class="item-list" id="itemList"></ul>
    <div class="empty" id="emptyMsg">No items captured yet.</div>
  </section>

</main>

<div id="photoModal">
  <img id="photoModalImg" src="" alt="">
  <div class="modal-actions">
    <button class="btn btn-secondary" id="photoModalPrintBtn">Print / Save as PDF</button>
    <button class="btn btn-secondary" id="photoModalCloseBtn">Close</button>
  </div>
</div>

<nav class="tabs">
  <button id="tabCapture" class="active">+ New Item</button>
  <button id="tabQueue">Queue / Print</button>
</nav>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
