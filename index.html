<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #121212;
    --panel: #1c1c1c;
    --panel2: #262626;
    --panel3: #2f2f2f;
    --accent: #d4a017;
    --accent-dim: rgba(212, 160, 23, 0.15);
    --text: #f0f0f0;
    --muted: #9a9a9a;
    --danger: #c0392b;
    --danger-dim: rgba(192, 57, 43, 0.15);
    --ok: #3a8a4a;
    --ok-dim: rgba(58, 138, 74, 0.15);
    --border: #333;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
    padding-bottom: 96px;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel);
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    padding: 16px 18px; display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.2px; }
  header h1::before { content: "📦 "; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .section-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--accent); margin: 0 0 12px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 500; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 14px; font-size: 16px; background: var(--panel2);
    border: 1.5px solid var(--border); border-radius: 10px; color: var(--text);
    min-height: 50px; transition: border-color 0.15s ease, background 0.15s ease;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent); background: var(--panel3);
  }
  input::placeholder { color: #6b6b6b; }
  select {
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%239a9a9a' stroke-width='2' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat: no-repeat; background-position: right 16px center; padding-right: 40px;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .btn {
    display: inline-block; width: 100%; padding: 16px; font-size: 16px; font-weight: 700;
    border-radius: 10px; border: none; text-align: center; cursor: pointer; margin-top: 10px;
    min-height: 52px; transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active { transform: scale(0.98); filter: brightness(0.92); }
  .btn-primary { background: var(--accent); color: #1a1a1a; box-shadow: 0 2px 10px rgba(212,160,23,0.25); }
  .btn-secondary { background: var(--panel2); color: var(--text); border: 1.5px solid var(--border); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-ok { background: var(--ok); color: white; }
  .toggle-group {
    display: flex; gap: 4px; margin-top: 4px; background: var(--panel2);
    border: 1.5px solid var(--border); border-radius: 10px; padding: 4px;
  }
  .toggle-group button {
    flex: 1; padding: 12px; border-radius: 7px; border: none;
    background: transparent; color: var(--muted); font-weight: 700; font-size: 15px;
    min-height: 44px; transition: background 0.15s ease, color 0.15s ease;
  }
  .toggle-group button.active { background: var(--accent); color: #1a1a1a; }

  /* Custom file picker — replaces the native grey "Choose File" control */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .file-drop {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 56px; padding: 14px; border-radius: 10px;
    border: 1.75px dashed var(--border); background: var(--panel2);
    color: var(--muted); font-size: 15px; font-weight: 600; text-align: center;
    cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .file-drop:active { background: var(--panel3); }
  .file-drop.has-photo { border-style: solid; border-color: var(--accent); color: var(--text); }
  .file-drop .icon { font-size: 20px; line-height: 1; }
  #photoPreview {
    width: 100%; max-height: 260px; object-fit: contain; border-radius: 10px;
    background: #000; display: none; margin-top: 10px; border: 1px solid var(--border);
  }
  .item-list { list-style: none; padding: 0; margin: 0; }
  .item-row {
    display: flex; gap: 12px; padding: 12px; border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px; background: var(--panel);
    align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .item-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: #000; cursor: pointer; flex-shrink: 0; }
  .item-meta { flex: 1; min-width: 0; }
  .item-meta .title { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .item-meta .sub { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .status-pill {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: 0.4px; margin-top: 4px;
    background: var(--panel3); color: var(--muted);
  }
  .status-pill.labeled { color: var(--accent); background: var(--accent-dim); }
  .status-pill.shelved { color: var(--ok); background: var(--ok-dim); }
  .item-actions { display: flex; flex-direction: column; gap: 8px; }
  .item-actions button {
    font-size: 13px; padding: 12px 10px; min-height: 44px; min-width: 88px; border-radius: 8px;
    border: 1.5px solid var(--border); background: var(--panel2); color: var(--text);
    font-weight: 600; transition: filter 0.15s ease, transform 0.08s ease;
  }
  .item-actions button:active { transform: scale(0.96); }
  .item-actions button.shelved-btn { border-color: var(--ok); color: var(--ok); background: var(--ok-dim); }
  .item-actions button.danger-btn { border-color: var(--danger); color: var(--danger); background: var(--danger-dim); }
  #photoModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 50;
    display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
  }
  #photoModal.active { display: flex; }
  #photoModal img { max-width: 100%; max-height: 68vh; border-radius: 8px; }
  #photoModal .modal-actions { display: flex; gap: 10px; margin-top: 16px; width: 100%; max-width: 380px; }
  #photoModal .modal-actions button { flex: 1; margin-top: 0; }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    box-shadow: 0 -2px 8px rgba(0,0,0,0.35); display: flex; z-index: 10;
  }
  nav.tabs button {
    flex: 1; padding: 14px 14px 16px; background: none; border: none; border-top: 3px solid transparent;
    color: var(--muted); font-size: 13px; font-weight: 700; min-height: 58px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  nav.tabs button .tab-icon { font-size: 18px; line-height: 1; }
  nav.tabs button.active { color: var(--accent); border-top-color: var(--accent); }
  .view { display: none; }
  .view.active { display: block; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .log { font-size: 11px; color: var(--muted); background: #000; border-radius: 6px; padding: 8px; max-height: 120px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
</style>
</head>
<body>

<header>
  <h1>Tracker</h1>
</header>

<main>

  <!-- CAPTURE VIEW -->
  <section id="view-capture" class="view active">
    <div class="card">
      <div class="section-title">New item</div>

      <label for="photoInput">Photo</label>
      <label class="file-drop" id="fileDropLabel" for="photoInput">
        <span class="icon">📷</span>
        <span id="fileDropText">Tap to take or choose a photo</span>
      </label>
      <input type="file" id="photoInput" accept="image/*" capture="environment" class="visually-hidden">
      <img id="photoPreview">

      <label>Captured by</label>
      <select id="employeeSelect">
        <option value="">Select...</option>
      </select>

      <label>This item is for</label>
      <div class="toggle-group">
        <button type="button" id="typeJobBtn" class="active">Job</button>
        <button type="button" id="typeStockBtn">Stock</button>
      </div>

      <div id="jobNumberWrap">
        <label>Job number</label>
        <input type="text" id="jobNumber" placeholder="e.g. J-4821" list="jobNumberOptions" autocomplete="off">
        <datalist id="jobNumberOptions"></datalist>
      </div>

      <label>Description</label>
      <input type="text" id="description" placeholder="e.g. 40mm hex bolts, box of 200" list="descriptionOptions" autocomplete="off">
      <datalist id="descriptionOptions"></datalist>

      <div class="row">
        <div>
          <label>Qty</label>
          <input type="number" id="qty" value="1" min="0">
        </div>
        <div>
          <label>Destination bin</label>
          <input type="text" id="destBin" placeholder="e.g. A-03-02" list="destBinOptions" autocomplete="off">
          <datalist id="destBinOptions"></datalist>
        </div>
      </div>

      <label>Group <span style="text-transform:none;font-weight:400;">(optional — e.g. Group 1, ENT, CAB, G2)</span></label>
      <input type="text" id="itemGroup" placeholder="e.g. ENT" list="itemGroupOptions" autocomplete="off">
      <datalist id="itemGroupOptions"></datalist>

      <label># of boxes for this item</label>
      <input type="number" id="boxCount" value="1" min="1" step="1">

      <button class="btn btn-primary" id="saveItemBtn">Save item</button>
    </div>
  </section>

  <!-- QUEUE VIEW -->
  <section id="view-queue" class="view">
    <div class="card">
      <div class="section-title">Export</div>
      <button class="btn btn-primary" id="exportPdfBtn">🖨️ Print / Save PDF list</button>
      <button class="btn btn-secondary" id="exportBtn">Export data (JSON backup)</button>
    </div>
    <ul class="item-list" id="itemList"></ul>
    <div class="empty" id="emptyMsg">No items captured yet.</div>
  </section>

</main>

<div id="photoModal">
  <img id="photoModalImg" src="" alt="">
  <div class="modal-actions">
    <button class="btn btn-secondary" id="photoModalPrintBtn">Print / Save as PDF</button>
    <button class="btn btn-secondary" id="photoModalCloseBtn">Close</button>
  </div>
</div>

<nav class="tabs">
  <button id="tabCapture" class="active"><span class="tab-icon">➕</span>New Item</button>
  <button id="tabQueue"><span class="tab-icon">📋</span>Queue / Print</button>
</nav>

<script src="qrcode.js"></script>
<script src="qrcode-utf8.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
